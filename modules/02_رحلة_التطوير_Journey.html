<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>القسم الثاني: رحلة التطوير والتجارب الهندسية | محفظة TPP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --moe-red: #8B0000;
      --moe-crimson: #DC2626;
      --moe-gold: #D4AF37;
      --moe-gold-dark: #B45309;
      --emerald-green: #047857;
      --tech-blue: #2563EB;
      --dark-slate: #0F172A;
      --navy-deep: #1E293B;
      --slate-subtle: #64748B;
      --border-card: #E2E8F0;
      
      --glass-surface: rgba(255, 255, 255, 0.88);
      --glass-card: rgba(255, 255, 255, 0.95);
      --glass-border: 1px solid rgba(255, 255, 255, 0.9);
      --card-radius: 20px;
      --pill-radius: 50px;
      --glow-soft: 0 10px 30px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-font-smoothing: antialiased; }
    
    body {
      margin: 0;
      padding: 20px;
      background: #F8FAFC;
      color: var(--dark-slate);
      min-height: 100vh;
      position: relative;
    }

    /* هالة ضوئية محيطية ناعمة */
    body::before {
      content: "";
      position: fixed;
      top: -120px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.10) 0%, rgba(4, 120, 87, 0.08) 50%, transparent 75%);
      filter: blur(80px);
      z-index: -2;
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* الترويسة والتنقل */
    .section-navbar {
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      border: var(--glass-border);
      box-shadow: var(--glow-soft);
      border-radius: var(--card-radius);
      padding: 16px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      border-top: 4px solid var(--tech-blue);
    }

    .nav-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: var(--navy-deep);
    }
    .nav-title span {
      font-size: 12px;
      color: var(--slate-subtle);
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .save-status-pill {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      padding: 6px 14px;
      border-radius: var(--pill-radius);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--slate-subtle);
    }

    .btn {
      padding: 9px 18px;
      border-radius: var(--pill-radius);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-save-master {
      background: linear-gradient(135deg, #059669 0%, #10B981 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }
    .btn-save-master:hover { transform: translateY(-1px); }
    .btn-back {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      color: var(--navy-deep);
    }
    .btn-add-exp {
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      font-size: 14px;
      padding: 10px 22px;
    }
    .btn-delete-exp {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA;
      font-size: 11.5px;
      padding: 5px 12px;
    }

    /* بطاقة التجربة التكرارية الشاملة */
    .experiment-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--border-card);
      box-shadow: var(--glow-soft);
      border-radius: var(--card-radius);
      padding: 26px;
      margin-bottom: 28px;
      position: relative;
      border-top: 5px solid var(--tech-blue);
    }

    .exp-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #F1F5F9;
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .exp-badge-number {
      background: #EFF6FF;
      color: var(--tech-blue);
      border: 1.5px solid #BFDBFE;
      padding: 5px 16px;
      border-radius: var(--pill-radius);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* صندوق الإرشاد التوجيهي لدليل التحكيم */
    .official-guide-box {
      background: #FFFDF5;
      border-right: 4px solid var(--moe-gold);
      border: 1px solid #FDE68A;
      border-right-width: 4px;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #92400E;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .official-guide-box strong { font-weight: 900; }

    /* حقول الإدخال */
    textarea, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 13.5px;
      color: var(--dark-slate);
      background: #FFFFFF;
      outline: none;
      transition: all 0.2s ease;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    textarea:focus, input:focus {
      border-color: var(--tech-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* شارات عداد الكلمات المعتمدة */
    .word-counter-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 10px;
      background: #F1F5F9;
      color: var(--slate-subtle);
    }
    .count-pass { background: #DCFCE7; color: #166534; }
    .count-warn { background: #FEE2E2; color: #991B1B; }

    /* جداول التحليل والقرارات الهندسية */
    .analysis-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid #CBD5E1;
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0 16px 0;
    }
    .analysis-table th {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      border-bottom: 1.5px solid #CBD5E1;
      border-left: 1px solid #CBD5E1;
      text-align: center;
    }
    .analysis-table th.th-pass { background: #ECFDF5; color: #065F46; }
    .analysis-table th.th-fail { background: #FEF2F2; color: #991B1B; }
    .analysis-table td {
      padding: 10px;
      border-bottom: 1px solid #E2E8F0;
      border-left: 1px solid #E2E8F0;
      vertical-align: top;
      background: #FFFFFF;
    }
    .analysis-table tr:last-child td { border-bottom: none; }
    .analysis-table td:last-child, .analysis-table th:last-child { border-left: none; }

    /* مربعات الصور الخفيفة */
    .media-box-slot {
      border: 2px dashed #CBD5E1;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      background: #FAFAFA;
      cursor: pointer;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .media-box-slot:hover { border-color: var(--tech-blue); background: #EFF6FF; }
    .img-preview-tag { max-width: 100%; max-height: 150px; border-radius: 6px; display: none; margin-top: 6px; }

    /* صندوق القرار للمحاولة القادمة المضيء */
    .next-step-focus-card {
      background: #FFFBEB;
      border: 1.5px solid #FCD34D;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- الترويسة الرئيسية -->
    <header class="section-navbar">
      <div class="nav-title">
        <h1>القسم الثاني: رحلة التطوير والتجارب الهندسية (يوميات التعلم)</h1>
        <span>البطولة الوطنية للابتكار والروبوت 2026 - 2027</span>
      </div>

      <div class="nav-actions">
        <span class="save-status-pill" id="liveSavePill">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #10B981;"></span>
          <span id="saveStatusText">محفوظ في مساحة العمل ✓</span>
        </span>
        <a href="../لوحة_التحكم_الرئيسية_Dashboard.html" class="btn btn-back">← قمرة القيادة</a>
        <button class="btn btn-save-master" onclick="commitAndSyncSection()">حفظ وتحديث المنظومة المركزية</button>
      </div>
    </header>

    <!-- شريط التحكم بإضافة التجارب -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;">
      <div>
        <strong style="font-size: 15px; color: var(--navy-deep);">سجل التجارب التكرارية الموثقة:</strong>
        <span style="font-size: 13px; color: var(--slate-subtle); margin-right: 6px;" id="total_exp_badge">(1 تجربة)</span>
      </div>
      <button class="btn btn-add-exp" onclick="addNewExperimentCard()">+ إضافة تجربة هندسية جديدة</button>
    </div>

    <!-- حاوية التجارب المتكررة ديناميكياً -->
    <div id="experimentsContainer"></div>

  </div>

  <script>
    // الرابط المعتمد لمحرك المحفظة السحابي (يُستدعى بصمت تام)
    const PORTFOLIO_ENGINE_URL = "https://script.google.com/macros/s/AKfycbwzHHkdguGJO4cEHhvHTMGmVNAxvmvAV69rKcVmKhvE5W-2_yJhUwtHMxcTmEjIYyov/exec";

    let autoSaveTimer = null;

    // الهيكل الأولي للتجارب
    let experimentsList = [
      {
        id: 1,
        title: "",
        date: new Date().toISOString().split('T')[0],
        attempt_goal: "",
        summary: "",
        what_succeeded: [{ topic: "", decision: "" }],
        what_failed: [{ topic: "", decision: "" }],
        next_step: ""
      }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      restoreExperimentsData();
      renderAllExperiments();
      attachAutoSaveListener();
    });

    // 1. بناء وعرض بطاقات التجارب ديناميكياً
    function renderAllExperiments() {
      const container = document.getElementById('experimentsContainer');
      container.innerHTML = '';

      experimentsList.forEach((exp, idx) => {
        const cardHtml = `
          <article class="experiment-card" id="exp_box_${idx}">
            
            <div class="exp-header-bar">
              <div style="display: flex; align-items: center; gap: 12px;">
                <span class="exp-badge-number">التجربة رقم #${idx + 1}</span>
                <span style="font-size: 13px; font-weight: 800; color: var(--slate-subtle);">تاريخ المحاولة:</span>
                <input type="date" value="${exp.date || ''}" onchange="updateExpField(${idx}, 'date', this.value)" style="width: auto; margin-bottom: 0; padding: 6px 12px;">
              </div>
              
              ${experimentsList.length > 1 ? `
                <button class="btn btn-delete-exp" onclick="removeExperimentCard(${idx})">🗑️ حذف هذه التجربة</button>
              ` : ''}
            </div>

            <div class="official-guide-box">
              💡 <strong>إرشاد دليل التحكيم الرسمي:</strong> هذه هي يومياتكم الهندسية! هنا توثقون رحلة التجربة والخطأ والتعلم. لا يوجد فشل في الهندسة، بل بيانات تقودكم للنجاح وإظهار تطور مشروعكم بناءً على تجارب حقيقية ونتائج ملموسة.
            </div>

            <!-- عنوان التجربة -->
            <label style="font-size: 13px; font-weight: 800; display: block; margin-bottom: 4px;">عنوان التجربة (اسم واضح ومحدد):</label>
            <input type="text" placeholder="مثال: اختبار عزم المحركات وثبات مركز الثقل الأولي..." value="${exp.title || ''}" oninput="updateExpField(${idx}, 'title', this.value)">

            <!-- ماذا حاولنا أن نفعل -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="font-size: 13px; font-weight: 800;">ماذا حاولنا أن نفعل في هذه المحاولة؟ (شرح تفصيلي مع بيان أدوار الأعضاء):</label>
              <span id="badge_goal_${idx}" class="word-counter-tag count-pass">0 / ≤ 100 كلمة</span>
            </div>
            <textarea rows="3" placeholder="صفوا هدف المحاولة وخطواتها باختصار ومن قام بماذا من أعضاء الفريق..." oninput="updateExpGoal(${idx}, this)">${exp.attempt_goal || ''}</textarea>

            <!-- صورة النتيجة والخلاصة المركزية -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 10px 0;">
              <div>
                <label style="font-size: 12.5px; font-weight: 800; display: block; margin-bottom: 4px;">صورة نتيجة التجربة المباشرة:</label>
                <div class="media-box-slot" onclick="document.getElementById('file_res_${idx}').click()">
                  <span id="lbl_res_${idx}">📷 انقر لإرفاق صورة نتيجة التجربة</span>
                  <input type="file" id="file_res_${idx}" accept="image/*" style="display: none;" onchange="handleImageSlot(${idx}, 'result', this)">
                  <img id="prev_res_${idx}" class="img-preview-tag" alt="معاينة النتيجة">
                </div>
              </div>

              <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                  <label style="font-size: 12.5px; font-weight: 800;">الخلاصة (استنتاج التجربة في جملة قوية):</label>
                  <span id="badge_sum_${idx}" class="word-counter-tag count-pass">0 / ≤ 25 كلمة</span>
                </div>
                <textarea rows="4" placeholder="لخصوا أهم استنتاج من التجربة بما لا يتجاوز 25 كلمة..." oninput="updateExpSummary(${idx}, this)">${exp.summary || ''}</textarea>
              </div>
            </div>

            <!-- جداول التحليل والقرارات: ما نجح وما لم ينجح -->
            <div style="margin-top: 14px;">
              <label style="font-size: 13px; font-weight: 900; color: var(--navy-deep); display: block;">تحليل النتائج والقرارات الهندسية المترتبة:</label>
              
              <table class="analysis-table">
                <thead>
                  <tr>
                    <th class="th-pass" style="width: 50%;">ما الذي نجح؟ (الموضوع / قرار الفريق)</th>
                    <th class="th-fail" style="width: 50%;">ما الذي لم ينجح؟ (أين حدثت المشكلة / قرار الفريق)</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <input type="text" placeholder="الجزء الذي نجح كما توقعتم..." value="${exp.what_succeeded?.[0]?.topic || ''}" oninput="updateExpSuccess(${idx}, 'topic', this.value)" style="margin-bottom: 6px;">
                      <textarea rows="2" placeholder="قرار الفريق بناءً على هذا النجاح..." oninput="updateExpSuccess(${idx}, 'decision', this.value)" style="margin-bottom: 0;">${exp.what_succeeded?.[0]?.decision || ''}</textarea>
                    </td>
                    <td>
                      <input type="text" placeholder="أين حدثت العقبة أو المشكلة بالضبط؟..." value="${exp.what_failed?.[0]?.topic || ''}" oninput="updateExpFail(${idx}, 'topic', this.value)" style="margin-bottom: 6px;">
                      <textarea rows="2" placeholder="قرار الفريق لمعالجة هذه العقبة..." oninput="updateExpFail(${idx}, 'decision', this.value)" style="margin-bottom: 0;">${exp.what_failed?.[0]?.decision || ''}</textarea>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- صور الفريق أثناء العمل -->
            <div style="margin-top: 12px;">
              <label style="font-size: 12.5px; font-weight: 800; display: block; margin-bottom: 6px;">صور الفريق أثناء إجراء التجربة (صورتان):</label>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="media-box-slot" onclick="document.getElementById('file_act1_${idx}').click()">
                  <span id="lbl_act1_${idx}">📷 صورة أثناء العمل (1)</span>
                  <input type="file" id="file_act1_${idx}" accept="image/*" style="display: none;" onchange="handleImageSlot(${idx}, 'act1', this)">
                  <img id="prev_act1_${idx}" class="img-preview-tag" alt="فريق العمل 1">
                </div>
                <div class="media-box-slot" onclick="document.getElementById('file_act2_${idx}').click()">
                  <span id="lbl_act2_${idx}">📷 صورة أثناء العمل (2)</span>
                  <input type="file" id="file_act2_${idx}" accept="image/*" style="display: none;" onchange="handleImageSlot(${idx}, 'act2', this)">
                  <img id="prev_act2_${idx}" class="img-preview-tag" alt="فريق العمل 2">
                </div>
              </div>
            </div>

            <!-- القرار للمحاولة القادمة -->
            <div class="next-step-focus-card">
              <label style="font-size: 13px; font-weight: 800; color: #92400E; display: block; margin-bottom: 4px;">
                القرار للمحاولة القادمة (بناءً على تحليلكم السابق، ما هي خطتكم التالية؟):
              </label>
              <input type="text" placeholder="مثال: إعادة تصميم قاعدة المستشعرات بزاوية 15 درجة لزيادة دقة المسح..." value="${exp.next_step || ''}" oninput="updateExpField(${idx}, 'next_step', this.value)" style="background: #FFFFFF; margin-bottom: 0;">
            </div>

          </article>
        `;
        container.innerHTML += cardHtml;
      });

      // تدقيق العدادات لكافة البطاقات المعروضة
      experimentsList.forEach((e, i) => {
        evalLimits(e.attempt_goal, `badge_goal_${i}`, 100);
        evalLimits(e.summary, `badge_sum_${i}`, 25);
      });

      document.getElementById('total_exp_badge').innerText = `(${experimentsList.length} تجارب موثقة)`;
    }

    // 2. تحديث الحقول والعدادات
    function updateExpField(idx, key, val) {
      experimentsList[idx][key] = val;
    }

    function updateExpGoal(idx, el) {
      experimentsList[idx].attempt_goal = el.value;
      evalLimits(el.value, `badge_goal_${idx}`, 100);
    }

    function updateExpSummary(idx, el) {
      experimentsList[idx].summary = el.value;
      evalLimits(el.value, `badge_sum_${idx}`, 25);
    }

    function updateExpSuccess(idx, key, val) {
      if (!experimentsList[idx].what_succeeded) experimentsList[idx].what_succeeded = [{}];
      experimentsList[idx].what_succeeded[0][key] = val;
    }

    function updateExpFail(idx, key, val) {
      if (!experimentsList[idx].what_failed) experimentsList[idx].what_failed = [{}];
      experimentsList[idx].what_failed[0][key] = val;
    }

    function evalLimits(text, badgeId, maxWords) {
      const words = text ? text.trim().split(/\s+/).length : 0;
      const el = document.getElementById(badgeId);
      if (!el) return;
      el.innerText = `${words} / ≤ ${maxWords} كلمة`;
      if (words <= maxWords) {
        el.className = "word-counter-tag count-pass";
      } else {
        el.className = "word-counter-tag count-warn";
      }
    }

    // 3. إضافة وحذف التجارب
    function addNewExperimentCard() {
      const newIndex = experimentsList.length + 1;
      experimentsList.push({
        id: newIndex,
        title: "",
        date: new Date().toISOString().split('T')[0],
        attempt_goal: "",
        summary: "",
        what_succeeded: [{ topic: "", decision: "" }],
        what_failed: [{ topic: "", decision: "" }],
        next_step: ""
      });
      renderAllExperiments();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function removeExperimentCard(idx) {
      if (confirm(`هل أنتم متأكدون من حذف التجربة رقم #${idx + 1}؟`)) {
        experimentsList.splice(idx, 1);
        renderAllExperiments();
        saveLocally();
      }
    }

    // 4. معالجة الصور الخفيفة
    function handleImageSlot(idx, slotType, input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgId = slotType === 'result' ? `prev_res_${idx}` : (slotType === 'act1' ? `prev_act1_${idx}` : `prev_act2_${idx}`);
          const lblId = slotType === 'result' ? `lbl_res_${idx}` : (slotType === 'act1' ? `lbl_act1_${idx}` : `lbl_act2_${idx}`);
          
          const img = document.getElementById(imgId);
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById(lblId).style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 5. الحفظ التلقائي الصامت
    function attachAutoSaveListener() {
      document.addEventListener('input', () => {
        const pill = document.getElementById('liveSavePill');
        const text = document.getElementById('saveStatusText');
        pill.style.background = "#FEF3C7";
        pill.style.color = "#92400E";
        text.innerText = "جاري الحفظ تلقائياً...";

        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => {
          saveLocally();
          pill.style.background = "#DCFCE7";
          pill.style.color = "#166534";
          text.innerText = "محفوظ في مساحة العمل ✓";
        }, 1200);
      });
    }

    function saveLocally() {
      localStorage.setItem('TPP_SECTION_2_DATA', JSON.stringify(experimentsList));
    }

    function restoreExperimentsData() {
      const saved = localStorage.getItem('TPP_SECTION_2_DATA');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            experimentsList = parsed;
          }
        } catch(e) {}
      }
    }

    // 6. المزامنة الرسمية مع المنظومة المركزية
    async function commitAndSyncSection() {
      saveLocally();
      const rawSession = localStorage.getItem('TPP_TEAM_SESSION');
      const session = rawSession ? JSON.parse(rawSession) : { team_id: "LOCAL_DEV", team_code: "AED1101" };

      try {
        const res = await fetch(PORTFOLIO_ENGINE_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "SYNC_TPP_MODULE",
            payload: {
              team_id: session.team_id,
              team_code: session.team_code,
              section_name: "section_2",
              section_data: experimentsList
            }
          })
        });
        const result = await res.json();
        if (result.success) {
          alert("✅ تم حفظ وتوثيق سجل التجارب الهندسية في المنظومة المركزية بنجاح!");
        } else {
          alert("تم الحفظ في مساحة عملك محلياً بنجاح.");
        }
      } catch(e) {
        alert("✅ تم الحفظ في مساحة عملك المحلية بأمان.");
      }
    }
  </script>
</body>
